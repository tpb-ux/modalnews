name: Verificar build
# O Modal News é coletado e publicado só pela VPS (git pull do main + cron 7,37).
# Este workflow apenas valida cada push: o build falha se houver link interno quebrado.
# Sem agendamento, sem commit e sem deploy para o GitHub Pages / IndexNow (feitos pela VPS).
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Build (falha se houver link interno quebrado)
        run: python build.py
