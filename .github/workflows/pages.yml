name: Coletar e publicar
on:
  push: {branches: [main]}
  schedule: [{cron: "17 */3 * * *"}]   # a cada 3 horas
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Coletar notícias (fetch.py)
        if: github.event_name != 'push'
        run: python fetch.py || echo "fetch falhou; seguindo com o conteúdo existente"
      - name: Atualizar preços do diesel (ANP, semanal)
        if: github.event_name != 'push'
        run: python tools/anp_diesel.py || echo "ANP indisponível; mantendo dados anteriores"
      - name: Atualizar rodovias (ANTT, semanal)
        if: github.event_name != 'push'
        run: python tools/antt_rodovias.py || echo "ANTT indisponível; mantendo dados anteriores"
      - name: IBGE (municípios novos)
        if: github.event_name != 'push'
        run: python tools/ibge_cidades.py || echo "IBGE indisponível; mantendo dados anteriores"
      - name: Tarifas de pedágio (ANTT, semanal)
        if: github.event_name != 'push'
        run: python tools/antt_tarifas.py || echo "ANTT tarifas indisponível; mantendo dados anteriores"
      - name: Distâncias OSRM para cidades novas (cache)
        if: github.event_name != 'push'
        run: timeout 900 python tools/osrm.py || echo "OSRM indisponível; mantendo cache"
      - name: Registrar meses de pedágio (resumo semanal)
        run: python paginas6.py
      - name: Commitar conteúdo novo
        if: github.event_name != 'push'
        run: |
          git config user.name "modalnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content static/img data
          git diff --cached --quiet || (git commit -m "Coleta automática $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: git pull --ff-only || true
      - run: python build.py > /dev/null
      - name: Notificar IndexNow (só URLs novas/alteradas)
        run: sleep 60 && python indexnow.py ping
      - name: Guardar hashes enviados
        run: |
          git config user.name "modalnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/indexnow_hashes.json ] || exit 0
          git add data/indexnow_hashes.json
          git diff --cached --quiet || (git commit -m "IndexNow: hashes [skip ci]" && git push)
