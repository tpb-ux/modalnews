name: Coletar e publicar
on:
  push: {branches: [main]}
  schedule: [{cron: "17 */3 * * *"}]   # a cada 3 horas
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Coletar notícias (fetch.py)
        if: github.event_name != 'push'
        run: python fetch.py || echo "fetch falhou; seguindo com o conteúdo existente"
      - name: Commitar conteúdo novo
        if: github.event_name != 'push'
        run: |
          git config user.name "modalnews-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet || (git commit -m "Coleta automática $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: public}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
