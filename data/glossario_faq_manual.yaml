# FAQs escritas à mão para os termos principais. Têm prioridade sobre as FAQs geradas automaticamente.
# Formato: slug: [{q: pergunta, a: resposta (40-80 palavras)}]
cross-docking:
  - q: "Qual a diferença entre cross docking e armazenagem tradicional?"
    a: "Na armazenagem tradicional, o produto é recebido, endereçado e fica estocado até surgir um pedido, o que pode levar semanas. No cross docking, a mercadoria chega já com destino definido e é transferida da doca de entrada para a de saída em poucas horas. Isso elimina o custo de posição de estoque, mas exige sincronismo fino entre chegadas, separação por destino e partida dos veículos."
  - q: "Quais tipos de produto funcionam melhor em cross docking?"
    a: "Funcionam melhor itens de alto giro e demanda previsível, como bebidas, alimentos perecíveis, produtos de higiene e mercadorias de campanhas promocionais. Também é comum em encomendas de e-commerce, que chegam em grande volume e precisam sair rapidamente por rota. Já produtos de baixo giro, sazonais ou com muitas variações de SKU tendem a funcionar melhor com estoque intermediário."
  - q: "Quais os erros mais comuns ao implantar cross docking?"
    a: "Os erros mais frequentes são aceitar caminhões sem agendamento, receber cargas sem aviso prévio de embarque e não ter área de consolidação marcada por destino. Sem informação antecipada sobre o que está chegando, a equipe precisa conferir tudo manualmente e a carga acaba parada na doca. Outro erro é usar o cross docking para esconder estoque excedente, o que derruba sua principal vantagem."
  - q: "Cross docking precisa de sistema WMS?"
    a: "Não é obrigatório, mas facilita muito. Operações pequenas funcionam com planilhas e etiquetas por destino. Em volumes maiores, o WMS recebe o aviso de embarque do fornecedor, indica para qual doca e qual rota cada volume deve seguir e registra o tempo de permanência. Sem esse controle, fica difícil provar ao cliente que a mercadoria passou poucas horas no armazém."
  - q: "Existe cross docking no Brasil?"
    a: "Sim, e ele é amplamente usado. Grandes redes de supermercado, distribuidores de bebidas, atacarejos e operadores de e-commerce mantêm centros de cross docking próximos a capitais e eixos rodoviários como a Anhanguera, a Dutra e o Rodoanel em São Paulo. Transportadoras de carga fracionada também operam terminais que, na prática, funcionam como cross docking entre coleta e distribuição."
wms:
  - q: "Quanto custa implantar um WMS?"
    a: "Depende do porte e do modelo. Soluções em nuvem para pequenas operações cobram mensalidade por usuário ou por volume movimentado, a partir de algumas centenas de reais por mês. Projetos para centros de distribuição grandes envolvem licença, integração com ERP, coletores de dados e consultoria, podendo chegar a centenas de milhares de reais. O custo de integração e de treinamento costuma ser subestimado."
  - q: "Qual a diferença entre WMS e ERP?"
    a: "O ERP controla o estoque como número contábil e fiscal, sabendo quanto a empresa tem de cada produto. O WMS controla o estoque físico dentro do armazém, sabendo em qual rua, prédio e nível está cada palete ou caixa, além de orientar as tarefas dos operadores. Por isso os dois sistemas trabalham integrados, trocando pedidos, notas e saldos."
  - q: "Quais os sinais de que a empresa precisa de um WMS?"
    a: "Os sinais mais claros são erros frequentes de separação, divergência entre o saldo do sistema e o físico, tempo alto para encontrar produtos, dependência de funcionários que sabem onde as coisas estão e dificuldade em controlar lotes e validades. Quando o armazém cresce em número de SKUs e de pedidos diários, controlar tudo em planilha se torna caro e arriscado."
  - q: "Quanto tempo leva para implantar um WMS?"
    a: "Implantações simples em nuvem podem entrar em operação em quatro a oito semanas. Projetos maiores, com integração ao ERP, coletores, impressoras de etiqueta, automação e vários armazéns, costumam levar de quatro meses a um ano. A etapa mais demorada geralmente é preparar o cadastro de produtos, endereçar o armazém e ajustar os processos antes de ligar o sistema."
  - q: "Quais indicadores um WMS ajuda a medir?"
    a: "Os mais usados são acuracidade de estoque, produtividade de separação em linhas ou unidades por hora, tempo médio entre recebimento e armazenagem, tempo de ciclo do pedido, taxa de erros de expedição e ocupação das posições. Com esses dados, o gestor identifica gargalos, dimensiona equipes para picos de demanda e negocia metas de nível de serviço com clientes."
tms:
  - q: "Qual a diferença entre TMS e roteirizador?"
    a: "O roteirizador resolve uma parte do problema, que é desenhar a melhor sequência de entregas para cada veículo. O TMS é mais amplo e cuida de cotação e contratação de transportadoras, cálculo e auditoria de frete, emissão de documentos, acompanhamento das ocorrências e indicadores de desempenho. Muitos TMS trazem um módulo de roteirização embutido ou se integram a roteirizadores especializados."
  - q: "Como o TMS ajuda a reduzir o custo de frete?"
    a: "Ele compara automaticamente as tabelas das transportadoras para cada pedido, sugere consolidar cargas que vão para a mesma região e confere se a fatura recebida bate com o valor contratado. A auditoria de frete sozinha costuma recuperar cobranças indevidas de taxas, pesos cubados errados e entregas duplicadas, que passam despercebidas quando a conferência é manual."
  - q: "TMS é usado por embarcadores ou por transportadoras?"
    a: "Pelos dois, mas com focos diferentes. O embarcador, como uma indústria ou varejista, usa o TMS para escolher transportadoras, controlar prazos e auditar fretes. A transportadora usa para gerenciar frota, motoristas, viagens, emissão de CT-e e MDF-e e faturamento. Existem soluções específicas para cada perfil, e algumas atendem ambos com módulos diferentes."
  - q: "O TMS emite CT-e e MDF-e?"
    a: "A maioria dos TMS voltados a transportadoras emite CT-e e MDF-e diretamente, comunicando-se com os sistemas das Secretarias da Fazenda. Já os TMS de embarcadores geralmente apenas recebem os arquivos XML dos CT-e emitidos pelas transportadoras, usando esses dados para conferir valores e conciliar faturas. Vale confirmar essa funcionalidade antes de contratar."
  - q: "Quais dados são necessários para começar a usar um TMS?"
    a: "É preciso ter cadastro confiável de clientes com endereço e janela de recebimento, produtos com peso e dimensões, tabelas de frete das transportadoras com regras de cálculo, prazos por região e integração com o ERP para receber pedidos e notas fiscais. Dados de peso e cubagem incompletos são a principal causa de cotações erradas no início da operação."
fob:
  - q: "No frete FOB, quem paga o frete?"
    a: "No Incoterm FOB, o comprador paga o frete marítimo internacional e o seguro, enquanto o vendedor arca com os custos até a mercadoria estar a bordo do navio no porto de embarque. No mercado interno brasileiro, a expressão frete FOB é usada de forma informal para indicar que o destinatário paga o transporte, diferente do frete CIF, pago pelo remetente."
  - q: "Qual a diferença entre FOB e CIF?"
    a: "Nos dois termos o risco passa ao comprador quando a carga está a bordo no porto de origem. A diferença está nos custos. No FOB, o comprador contrata e paga o frete marítimo e o seguro. No CIF, o vendedor contrata e paga o frete até o porto de destino e um seguro com cobertura mínima em favor do comprador."
  - q: "Posso usar FOB para carga aérea ou em contêiner?"
    a: "Tecnicamente, o FOB foi pensado para transporte marítimo e hidroviário, com carga entregue a bordo do navio. Para carga aérea, rodoviária ou contêineres entregues em terminal antes do embarque, a ICC recomenda o FCA, porque o vendedor perde o controle da carga quando a entrega ao terminal, e não quando ela sobe ao navio."
  - q: "Como aparece o FOB no contrato de exportação?"
    a: "O termo deve vir acompanhado do porto de embarque e da versão das regras, por exemplo FOB Porto de Santos, Incoterms 2020. Sem o porto indicado, surgem dúvidas sobre onde termina a responsabilidade do vendedor. Na DU-E, o valor FOB da mercadoria também é a base das estatísticas oficiais de exportação brasileiras."
  - q: "Quais os riscos de vender FOB para o exportador?"
    a: "O principal risco é depender do navio e do agente escolhidos pelo comprador. Se o navio atrasa ou a reserva é cancelada, a carga pode ficar parada no terminal gerando armazenagem, e o exportador ainda precisa cumprir prazos de entrega. Por outro lado, ele não assume custos de frete internacional nem variações de tarifa dos armadores."
cif:
  - q: "O que o seguro do CIF cobre?"
    a: "As regras Incoterms 2020 exigem que, no CIF, o vendedor contrate apenas seguro com cobertura mínima, equivalente às cláusulas C do Institute Cargo Clauses, por pelo menos 110% do valor do contrato. Essa cobertura não inclui muitos riscos, como roubo ou manuseio inadequado. Por isso, compradores costumam contratar seguro complementar ou negociar cobertura mais ampla no contrato."
  - q: "Qual a diferença entre CIF e CIP?"
    a: "Os dois incluem frete e seguro pagos pelo vendedor, mas o CIF serve apenas para transporte marítimo e hidroviário, enquanto o CIP vale para qualquer modal, inclusive aéreo e multimodal. Outra diferença importante é o seguro, que no CIP precisa ter cobertura ampla, equivalente às cláusulas A, enquanto no CIF a exigência é de cobertura mínima."
  - q: "Na importação brasileira, o valor CIF tem importância?"
    a: "Sim. O valor aduaneiro usado no cálculo do imposto de importação no Brasil considera o valor da mercadoria somado ao frete e ao seguro internacionais até o porto ou aeroporto de chegada, o que na prática corresponde a uma base CIF. Por isso, mesmo comprando FOB, o importador precisa informar frete e seguro na declaração."
  - q: "O que significa frete CIF no mercado interno?"
    a: "No transporte dentro do Brasil, frete CIF é a expressão usada quando o remetente paga o frete e entrega a mercadoria no endereço do comprador. É um uso informal, sem relação direta com as regras da ICC, mas aparece na nota fiscal no campo de modalidade do frete, em que se indica se o transporte é por conta do emitente ou do destinatário."
  - q: "Em que momento o risco passa ao comprador no CIF?"
    a: "Embora o vendedor pague o frete até o destino, o risco passa ao comprador quando a mercadoria é colocada a bordo do navio no porto de embarque. Se a carga for danificada durante a viagem, quem sofre a perda é o comprador, que aciona o seguro contratado pelo vendedor. Essa separação entre custo e risco confunde muitos importadores iniciantes."
incoterms:
  - q: "Quantos Incoterms existem atualmente?"
    a: "A versão Incoterms 2020 tem 11 termos. Sete servem para qualquer modal, EXW, FCA, CPT, CIP, DAP, DPU e DDP, e quatro são exclusivos do transporte marítimo e hidroviário, FAS, FOB, CFR e CIF. A versão de 2020 substituiu o DAT pelo DPU e passou a exigir cobertura de seguro mais ampla no CIP."
  - q: "Os Incoterms são obrigatórios por lei?"
    a: "Não. Os Incoterms são regras privadas criadas pela Câmara de Comércio Internacional, e só se aplicam quando as partes as citam no contrato. Na prática, porém, são exigidos em sistemas como o Siscomex e usados por bancos, seguradoras e despachantes, o que os torna padrão em praticamente todas as operações de comércio exterior brasileiras."
  - q: "Os Incoterms definem a transferência de propriedade da mercadoria?"
    a: "Não. Esse é um erro comum. Os Incoterms tratam apenas da entrega, da divisão de custos, da transferência de risco e de quem cuida do desembaraço aduaneiro. A propriedade, as condições de pagamento, as penalidades e a lei aplicável precisam ser definidas no contrato de compra e venda ou em outros documentos da operação."
  - q: "Qual Incoterm é melhor para quem está começando a importar?"
    a: "Para iniciantes, termos em que o vendedor entrega mais perto do Brasil, como CFR ou CIF, simplificam a logística no exterior. Mas quem quer controlar custo e prazo costuma preferir FOB ou FCA, contratando um agente de carga de confiança. O DDP raramente é viável na importação brasileira, porque exige que o vendedor estrangeiro recolha tributos aqui."
  - q: "Ainda é possível usar o Incoterms 2010?"
    a: "Sim. As partes podem escolher qualquer versão, desde que a indiquem no contrato, por exemplo FOB Santos Incoterms 2010. Se a versão não for mencionada, pode haver discussão sobre quais regras valem. Por isso, recomenda-se sempre escrever o termo, o local e a versão, preferencialmente a mais recente, de 2020."
last-mile:
  - q: "Por que a última milha é a etapa mais cara da entrega?"
    a: "Porque a carga deixa de viajar consolidada e passa a ser entregue em pequenos volumes, endereço por endereço. O veículo faz dezenas de paradas, enfrenta trânsito, restrições de horário e dificuldade para estacionar, e muitas vezes encontra o destinatário ausente. Estudos de mercado costumam apontar que a última milha responde por algo entre 40% e 50% do custo total da entrega."
  - q: "Quais as alternativas para reduzir o custo da última milha?"
    a: "As principais são lockers e pontos de retirada em lojas e farmácias, entrega com janela de horário agendada, roteirização dinâmica, uso de bicicletas e motos em áreas centrais, centros de distribuição urbanos menores e consolidação de pedidos do mesmo cliente. Oferecer frete mais barato para retirada também desloca parte do volume para opções mais eficientes."
  - q: "O que é entrega same day e next day?"
    a: "Same day é a entrega no mesmo dia da compra, e next day, no dia seguinte. Para cumprir esses prazos, a empresa precisa ter estoque próximo do cliente, corte de pedidos em horário definido e frota disponível para várias saídas por dia. No Brasil, essas modalidades se concentram nas capitais e regiões metropolitanas, onde o volume justifica a estrutura."
  - q: "Quais indicadores medir na última milha?"
    a: "Os mais importantes são entregas no prazo, taxa de sucesso na primeira tentativa, custo por entrega, número de entregas por rota, devoluções por endereço não encontrado e avaliação do cliente. A taxa de primeira tentativa é especialmente relevante, porque cada reentrega praticamente dobra o custo daquele pedido e piora a experiência do comprador."
  - q: "Quais desafios a última milha enfrenta no Brasil?"
    a: "Além do trânsito das grandes cidades, há restrições de circulação de caminhões, endereços imprecisos em bairros sem CEP individualizado, áreas de risco onde a entrega é restrita e roubo de cargas. Empresas respondem com motoristas locais, entregas em pontos parceiros, verificação de endereço no checkout e uso de veículos menores e mais discretos."
picking:
  - q: "Quais são os principais tipos de picking?"
    a: "Os mais comuns são picking discreto, em que o operador separa um pedido por vez; por lote, em que coleta vários pedidos de uma vez; por zona, em que cada operador cuida de uma área do armazém; e por onda, em que os pedidos são liberados em blocos conforme horários de transporte. Operações grandes combinam esses métodos."
  - q: "Como medir a produtividade do picking?"
    a: "O indicador mais usado é o número de linhas de pedido separadas por hora por operador, mas também se mede unidades por hora e pedidos por hora. É importante acompanhar junto a taxa de erro, porque aumentar a velocidade sem controle de qualidade gera devoluções. O tempo de deslocamento costuma representar mais da metade do tempo total de separação."
  - q: "O que é picking por voz e picking by light?"
    a: "No picking por voz, o operador usa fone e microfone e recebe instruções faladas do sistema, deixando mãos e olhos livres. No picking by light, luzes instaladas nas posições indicam de onde retirar e quantas unidades. As duas tecnologias reduzem erros e treinamento, sendo comuns em centros de distribuição de alimentos, farmácia e varejo."
  - q: "Quais os erros mais comuns na separação de pedidos?"
    a: "Os erros mais frequentes são trocar produtos parecidos, errar quantidades, separar lote com validade incorreta e enviar itens com avaria. Entre as causas estão endereçamento confuso, produtos semelhantes lado a lado, falta de conferência por código de barras e excesso de horas extras em picos. Uma boa revisão do slotting costuma reduzir bastante esses problemas."
  - q: "Como reduzir o tempo de picking sem automação cara?"
    a: "Posicionar os itens de maior giro perto da expedição, agrupar produtos que costumam sair juntos, usar carrinhos que permitam separar vários pedidos por percurso e organizar rotas de coleta em sentido único já trazem ganhos expressivos. Etiquetas claras nas posições e coletores de código de barras simples também reduzem tempo perdido com conferência e retrabalho."
ct-e:
  - q: "Quem é obrigado a emitir CT-e?"
    a: "Devem emitir CT-e as empresas que prestam serviço de transporte de cargas intermunicipal, interestadual ou internacional, em todos os modais. O caminhoneiro autônomo pessoa física normalmente não emite CT-e; nesse caso, o contratante ou uma empresa responsável cuida da documentação, conforme as regras do estado. O transporte de carga própria também não exige CT-e, apenas a nota fiscal."
  - q: "Qual a diferença entre CT-e e NF-e?"
    a: "A NF-e documenta a venda ou circulação da mercadoria e é emitida por quem vende ou remete o produto. O CT-e documenta o serviço de transporte e é emitido pela transportadora. Numa entrega típica, uma mesma carga viaja acompanhada das NF-e das mercadorias e do CT-e que registra o frete cobrado por levá-las."
  - q: "O que é o DACTE?"
    a: "DACTE é o Documento Auxiliar do Conhecimento de Transporte Eletrônico, uma representação impressa simplificada do CT-e, com chave de acesso e código de barras. Ele acompanha a carga para facilitar a consulta pela fiscalização e a conferência no recebimento, mas não substitui o arquivo digital, que é o documento fiscal válido."
  - q: "É possível cancelar ou corrigir um CT-e?"
    a: "O cancelamento é permitido em prazo curto após a autorização, desde que o transporte não tenha começado, conforme a legislação. Erros que não alteram valores, partes ou dados essenciais podem ser corrigidos por carta de correção eletrônica. Para outros casos existem o CT-e de anulação e o CT-e substituto, que precisam seguir regras específicas."
  - q: "O que acontece se a carga viajar sem CT-e?"
    a: "Em uma fiscalização, a falta do CT-e quando ele é obrigatório pode resultar em multa, cobrança de ICMS sobre o frete e até retenção do veículo até a regularização. Além do problema fiscal, a ausência do documento dificulta a cobrança do frete e o acionamento do seguro em caso de sinistro."
mdf-e:
  - q: "Quando o MDF-e é obrigatório?"
    a: "O MDF-e é obrigatório no transporte interestadual de cargas com mais de um documento fiscal e também quando a transportadora leva cargas com CT-e, além de outras situações definidas pelos estados. Empresas que transportam carga própria entre estados com mais de uma NF-e também precisam emitir. As regras exatas variam e devem ser conferidas na legislação estadual."
  - q: "Qual a diferença entre MDF-e e CT-e?"
    a: "O CT-e registra cada prestação de serviço de transporte, com valor do frete e tributos. O MDF-e não tem valor de frete, é um manifesto que lista todos os documentos que estão no veículo naquela viagem, além da placa, do motorista e do percurso. Um caminhão pode levar vários CT-e, mas viaja com um MDF-e."
  - q: "Por que é importante encerrar o MDF-e?"
    a: "Porque o sistema não permite emitir um novo manifesto para o mesmo veículo e mesma unidade da federação enquanto houver MDF-e anterior em aberto. Esquecer de encerrar trava a próxima viagem e gera alertas para a fiscalização. O encerramento deve ser feito assim que a carga chega ao destino final."
  - q: "O que é o DAMDFE?"
    a: "DAMDFE é o Documento Auxiliar do Manifesto Eletrônico de Documentos Fiscais, uma versão impressa simplificada que acompanha o veículo. Ele traz a chave de acesso e o QR Code para consulta do manifesto completo pela fiscalização. O documento fiscal válido é o arquivo eletrônico autorizado; o DAMDFE serve para facilitar a conferência na estrada."
  - q: "O MDF-e precisa informar o CIOT e o vale-pedágio?"
    a: "Em contratações de transportadores autônomos e em outros casos previstos pela ANTT, o MDF-e deve trazer informações como o código de identificação da operação de transporte, quando exigido, e os dados do vale-pedágio. Isso permite que os órgãos cruzem informações e verifiquem se o pagamento ao transportador e os pisos de frete foram respeitados."
frete:
  - q: "Como é calculado o frete rodoviário?"
    a: "O cálculo normalmente combina o frete-peso, baseado no maior valor entre peso real e peso cubado, com o frete-valor, um percentual sobre o valor da nota. Somam-se taxas como GRIS, pedágio, coleta, entrega com dificuldade e ICMS. Em cargas de lotação, o preço costuma ser fechado por viagem, considerando distância, tipo de veículo e tabela mínima da ANTT."
  - q: "Qual a diferença entre frete CIF e frete FOB no Brasil?"
    a: "No uso comercial brasileiro, frete CIF significa que o remetente paga o transporte até o cliente, e frete FOB que o destinatário paga ou retira a mercadoria. Essa informação vai na nota fiscal, no campo de modalidade do frete, e afeta quem contrata a transportadora, quem assume riscos e como o custo aparece na formação de preço."
  - q: "Por que o frete subiu se o diesel caiu?"
    a: "O diesel é o principal item, mas o frete também depende de salário de motoristas, pedágio, manutenção, preço de caminhões e pneus, seguro, juros e da relação entre oferta e demanda de veículos. Em períodos de safra ou de alta demanda no varejo, faltam caminhões disponíveis e o frete sobe mesmo com combustível estável."
  - q: "Quem paga o ICMS do frete?"
    a: "O ICMS sobre o serviço de transporte intermunicipal e interestadual é devido, em regra, pela transportadora que presta o serviço, mas há casos de substituição tributária em que o tomador do serviço recolhe o imposto. As alíquotas e regras variam por estado, e a definição correta deve constar no CT-e."
  - q: "Frete grátis existe mesmo?"
    a: "Não. Quando uma loja oferece frete grátis, o custo do transporte é absorvido na margem do produto, diluído no preço ou subsidiado por campanhas de marketplaces. A estratégia aumenta a conversão de vendas, mas exige controle para que pedidos de baixo valor para regiões distantes não gerem prejuízo. Muitas lojas limitam o benefício por valor mínimo ou região."
lead-time:
  - q: "Como calcular o lead time de um pedido?"
    a: "Basta medir o tempo entre o evento inicial e o final escolhidos. No lead time de entrega, por exemplo, conta-se da confirmação da compra pelo cliente até o recebimento no endereço. Para entender onde está a demora, divide-se o total em etapas como aprovação do pagamento, separação, faturamento, transporte e entrega, medindo cada uma separadamente."
  - q: "Qual a diferença entre lead time e transit time?"
    a: "O transit time considera apenas o tempo em que a carga está em trânsito, do embarque ao desembarque. O lead time é mais amplo e inclui tempos de processamento do pedido, produção, separação, espera por transporte, desembaraço e entrega. Em uma importação, o transit time marítimo pode ser de 35 dias, mas o lead time total facilmente passa de 60."
  - q: "Por que a variabilidade do lead time importa tanto quanto a média?"
    a: "Porque o estoque de segurança é dimensionado para cobrir atrasos. Um fornecedor que entrega sempre em 10 dias exige menos estoque do que outro que entrega em média em 8, mas às vezes em 3 e às vezes em 20. Reduzir a variação permite trabalhar com menos estoque e evita rupturas inesperadas."
  - q: "Como reduzir o lead time na logística?"
    a: "As medidas mais eficazes são eliminar etapas de espera, como aprovações manuais e lotes de faturamento, posicionar estoque mais perto do cliente, integrar sistemas com fornecedores e transportadoras, agendar coletas diárias e escolher modais e rotas mais rápidos para itens críticos. Mapear o processo completo costuma revelar que boa parte do tempo é de fila, não de trabalho."
  - q: "Lead time e prazo de entrega são a mesma coisa?"
    a: "Não exatamente. O prazo de entrega é a promessa feita ao cliente, enquanto o lead time é o tempo real medido na operação. Uma boa prática é definir o prazo prometido com base no lead time histórico mais uma margem, para que a empresa cumpra o combinado na grande maioria dos pedidos."
estoque-de-seguranca:
  - q: "Como calcular o estoque de segurança?"
    a: "Uma fórmula comum multiplica um fator Z, ligado ao nível de serviço desejado, pelo desvio padrão da demanda e pela raiz quadrada do lead time. Para nível de serviço de 95%, usa-se Z de aproximadamente 1,65. Se o lead time também varia, a fórmula ganha um termo adicional para essa variação. Planilhas e sistemas de planejamento fazem esse cálculo automaticamente."
  - q: "Estoque de segurança e estoque mínimo são a mesma coisa?"
    a: "Não. O estoque de segurança é a reserva para imprevistos e, idealmente, quase nunca é consumido. O estoque mínimo, ou ponto de pedido em muitas empresas, é o nível que dispara uma nova compra, incluindo a demanda esperada durante o prazo de reposição mais o próprio estoque de segurança."
  - q: "Quais erros são comuns ao definir estoque de segurança?"
    a: "Os mais comuns são usar o mesmo número de dias para todos os produtos, ignorar a variação do prazo do fornecedor, não revisar os parâmetros após mudanças de demanda e dimensionar com base em percepção, sem dados. O resultado costuma ser excesso de estoque em itens de baixa importância e falta justamente nos itens mais vendidos."
  - q: "Quanto custa manter estoque de segurança?"
    a: "O custo inclui o capital parado, armazenagem, seguro, perdas por obsolescência e validade, além de manuseio. Em muitas empresas brasileiras, o custo anual de manter estoque fica entre 20% e 35% do valor da mercadoria, principalmente por causa dos juros elevados. Por isso, o nível de serviço deve ser definido por classe de produto."
  - q: "Quando faz sentido aumentar o estoque de segurança?"
    a: "Faz sentido em períodos de incerteza no fornecimento, como greves, crises em portos ou falta de insumos, antes de picos sazonais com demanda instável, e para itens críticos em que a falta para a produção ou causa perda de clientes importantes. Fora dessas situações, o caminho mais barato costuma ser reduzir a variabilidade do processo."
curva-abc:
  - q: "Como fazer uma curva ABC na prática?"
    a: "Liste todos os itens com o valor movimentado no período, ordene do maior para o menor e calcule o percentual acumulado. Itens até cerca de 80% do valor acumulado formam a classe A, os seguintes até cerca de 95% a classe B e o restante a classe C. Os cortes podem ser ajustados conforme a realidade da empresa."
  - q: "A curva ABC é o mesmo que o princípio de Pareto?"
    a: "A curva ABC é uma aplicação prática do princípio de Pareto, que observa que poucas causas respondem pela maior parte dos efeitos. Enquanto o Pareto fala genericamente na proporção 80/20, a curva ABC divide os itens em três grupos com tratamentos diferentes de compra, armazenagem, inventário e nível de serviço."
  - q: "Devo fazer a curva ABC por faturamento ou por quantidade?"
    a: "Depende do objetivo. Para decisões financeiras e de compras, a curva por valor faz mais sentido. Para organizar o armazém e o picking, a curva por número de saídas ou linhas de pedido é mais útil, porque mostra quais itens geram mais deslocamento. Muitas empresas combinam as duas, criando uma matriz de classificação."
  - q: "Com que frequência atualizar a curva ABC?"
    a: "Uma revisão trimestral atende a maioria das empresas, mas negócios com forte sazonalidade, lançamentos frequentes ou e-commerce com muitas promoções podem precisar de revisão mensal. O importante é não deixar a classificação congelada, porque produtos mudam de importância e o armazém fica desorganizado se o slotting não acompanhar."
  - q: "O que é a curva XYZ e como ela complementa a ABC?"
    a: "A curva XYZ classifica os itens pela estabilidade da demanda, sendo X para consumo regular, Y para variação moderada e Z para demanda irregular. Combinada com a ABC, permite decisões mais finas, como manter estoque de segurança maior em itens AZ, valiosos e imprevisíveis, e automatizar compras de itens CX, baratos e estáveis."
just-in-time:
  - q: "Just in time significa estoque zero?"
    a: "Não. O objetivo é reduzir estoques ao mínimo necessário, mas sempre existem pequenos estoques em processo e reservas para variações. Empresas que interpretaram o conceito como estoque zero absoluto ficaram muito expostas a falhas de fornecedores e de transporte, especialmente durante a pandemia de covid-19 e a crise global de semicondutores."
  - q: "Quais as condições para o just in time funcionar?"
    a: "É preciso ter fornecedores confiáveis e próximos, transporte com horários previsíveis, qualidade alta para evitar retrabalho, demanda relativamente estável e troca de informações frequente entre empresas. No Brasil, distâncias longas, infraestrutura irregular e riscos de greve tornam a aplicação mais difícil fora de polos industriais concentrados, como o setor automotivo."
  - q: "Qual a diferença entre just in time e just in case?"
    a: "O just in time abastece apenas o necessário, no momento certo, privilegiando eficiência e baixo estoque. O just in case mantém estoques maiores como proteção contra incertezas, privilegiando segurança. Depois das crises recentes nas cadeias globais, muitas empresas passaram a combinar os dois, mantendo just in time para itens estáveis e reservas para insumos críticos."
  - q: "Onde o just in time é usado no Brasil?"
    a: "O exemplo mais conhecido é a indústria automotiva, em que fornecedores instalados ao redor das montadoras entregam peças várias vezes ao dia, às vezes já na sequência de montagem. Também aparece em fabricantes de eletroeletrônicos, linha branca e em redes de restaurantes, que recebem insumos frescos diariamente."
  - q: "Quais os riscos do just in time?"
    a: "Com pouco estoque, qualquer interrupção, como atraso de navio, bloqueio de rodovia, falta de componente ou problema de qualidade, para a produção rapidamente. Por isso, empresas que adotam o modelo mapeiam fornecedores críticos, mantêm alternativas qualificadas e definem pequenas reservas estratégicas para os itens com maior risco de falta."
logistica-reversa:
  - q: "A logística reversa é obrigatória no Brasil?"
    a: "Sim, para vários setores. A Política Nacional de Resíduos Sólidos, Lei 12.305 de 2010, obriga fabricantes, importadores, distribuidores e comerciantes de produtos como agrotóxicos, pilhas e baterias, pneus, óleos lubrificantes, lâmpadas, eletroeletrônicos e embalagens a estruturar sistemas de retorno, muitas vezes por meio de acordos setoriais e entidades gestoras."
  - q: "Qual a diferença entre logística reversa de pós-venda e de pós-consumo?"
    a: "A de pós-venda trata de produtos que retornam pouco depois da compra, como trocas, devoluções por arrependimento, defeitos e recalls. A de pós-consumo trata de produtos e embalagens no fim da vida útil, que precisam ser reciclados, reaproveitados ou descartados corretamente. Os fluxos, custos e parceiros envolvidos costumam ser bem diferentes."
  - q: "Como funciona a devolução de compras online no Brasil?"
    a: "O Código de Defesa do Consumidor garante o direito de arrependimento em até sete dias após o recebimento para compras feitas fora do estabelecimento, como na internet. Nesses casos, o consumidor não paga pela devolução. As lojas costumam oferecer postagem em agências, coleta em domicílio ou entrega em pontos parceiros."
  - q: "Como reduzir o custo da logística reversa?"
    a: "Medidas úteis incluem descrições e fotos precisas para evitar devoluções, triagem rápida para devolver itens bons ao estoque, consolidação de retornos em pontos de coleta, parcerias com recicladoras e análise dos motivos de devolução por produto. Em muitos casos, o maior custo é o produto parado aguardando decisão, não o transporte em si."
  - q: "Logística reversa pode gerar receita?"
    a: "Sim. Itens devolvidos em bom estado voltam à venda, produtos com pequenos defeitos podem ser reparados e vendidos como recondicionados, e materiais como papelão, plástico e metais geram receita com reciclagem. Empresas que tratam o retorno como uma cadeia de valor conseguem reduzir perdas e ainda melhorar indicadores ambientais."
milk-run:
  - q: "Qual a diferença entre milk run e coleta tradicional?"
    a: "Na coleta tradicional, cada fornecedor envia sua carga quando tem volume suficiente, muitas vezes com caminhões parcialmente vazios e horários imprevisíveis. No milk run, o cliente define uma rota fixa com horários marcados, e um mesmo veículo passa por vários fornecedores, consolidando as cargas. O resultado é maior frequência, menor estoque e melhor ocupação dos caminhões."
  - q: "Quem contrata o transporte no milk run?"
    a: "Normalmente é o cliente, como a montadora ou o varejista, que contrata o operador logístico e assume o controle da rota. Assim, ele padroniza horários, embalagens e volumes. Isso costuma exigir renegociar as condições comerciais com fornecedores, que antes embutiam o frete no preço e passam a vender com retirada."
  - q: "Quais setores usam milk run no Brasil?"
    a: "O setor automotivo é o principal usuário, com rotas que abastecem montadoras em polos como o ABC paulista, o sul de Minas e o Paraná. O modelo também é usado na indústria de eletroeletrônicos, de alimentos e por redes varejistas que coletam produtos de fornecedores regionais para abastecer seus centros de distribuição."
  - q: "Quais as dificuldades para implantar um milk run?"
    a: "As principais são fornecedores muito distantes entre si, volumes que variam muito de um dia para o outro, falta de embalagens padronizadas e dificuldade dos fornecedores em cumprir horários de carregamento. Também é preciso integrar informações de pedidos para que cada fornecedor saiba exatamente quanto separar antes da passagem do veículo."
  - q: "Por que o nome milk run?"
    a: "O termo vem da antiga coleta de leite em fazendas, em que um caminhão passava diariamente em várias propriedades numa rota fixa recolhendo os latões e levando tudo para o laticínio. A lógica é a mesma aplicada hoje à indústria, com rota e horários regulares e consolidação de pequenas cargas de vários pontos."
fulfillment:
  - q: "Qual a diferença entre fulfillment e armazém tradicional?"
    a: "Um armazém tradicional costuma movimentar paletes e caixas fechadas para outras empresas. O fulfillment é desenhado para o e-commerce, com pedidos de poucas unidades para consumidores finais, separação item a item, embalagem personalizada, integração com lojas virtuais e marketplaces e gestão de devoluções. O volume de pedidos é alto e o tamanho de cada pedido, pequeno."
  - q: "Quanto custa usar um serviço de fulfillment?"
    a: "A cobrança costuma combinar armazenagem por volume ou posição ocupada, taxa por pedido separado, taxa por item adicional, materiais de embalagem e o frete de entrega. Alguns marketplaces cobram tarifas reduzidas para estimular vendedores a usar seus centros. É importante simular o custo total por pedido antes de migrar."
  - q: "O fulfillment dos marketplaces vale a pena para pequenos lojistas?"
    a: "Em muitos casos, sim, porque o produto ganha prazos de entrega menores, selos de entrega rápida e melhor posicionamento nas buscas, o que aumenta as vendas. Por outro lado, o lojista perde parte do controle sobre o estoque e precisa enviar volumes mínimos, além de pagar armazenagem se o produto encalhar."
  - q: "Quais indicadores avaliar em um fornecedor de fulfillment?"
    a: "Os principais são prazo de expedição a partir do pedido, acuracidade de estoque, taxa de erros de separação, avarias, tempo de processamento de devoluções, horários de corte e integração com as plataformas de venda. Também vale verificar a capacidade de absorver picos como a Black Friday sem atrasos."
  - q: "Fulfillment e dropshipping são a mesma coisa?"
    a: "Não. No fulfillment, o lojista é dono do estoque, que fica armazenado em um centro especializado responsável por separar e enviar os pedidos. No dropshipping, o lojista não tem estoque, e o fornecedor envia o produto diretamente ao consumidor depois da venda, o que reduz investimento, mas dá menos controle sobre prazo e qualidade."
centro-de-distribuicao:
  - q: "Qual a diferença entre centro de distribuição e armazém?"
    a: "O armazém é voltado principalmente para guardar mercadorias, às vezes por longos períodos. O centro de distribuição é desenhado para fluxo, com recebimento, separação de pedidos e expedição frequentes, e o estoque gira rapidamente. Na prática, muitos imóveis fazem as duas funções, mas o layout, os equipamentos e os indicadores são diferentes."
  - q: "Como escolher a localização de um centro de distribuição?"
    a: "A escolha considera a localização dos clientes e fornecedores, acesso a rodovias e aeroportos, custo do imóvel, incentivos fiscais estaduais, disponibilidade de mão de obra e prazos de entrega desejados. Estudos de rede logística costumam simular vários cenários para equilibrar custo de frete, custo de armazenagem e nível de serviço."
  - q: "Por que tantos CDs ficam em Cajamar e Extrema?"
    a: "Cajamar, em São Paulo, fica junto à Anhanguera e ao Rodoanel, com acesso rápido à capital e ao interior. Extrema, em Minas Gerais, está na Fernão Dias, perto de São Paulo, e oferece benefícios fiscais estaduais. Essa combinação de localização e incentivos atraiu grandes varejistas, operadores logísticos e marketplaces para as duas cidades."
  - q: "Quais indicadores medir em um centro de distribuição?"
    a: "Os mais comuns são acuracidade de estoque, pedidos expedidos no prazo, produtividade por operador, tempo de recebimento a armazenagem, ocupação das posições, custo por pedido ou por unidade movimentada e índice de avarias. Acompanhados diariamente, esses números mostram onde ajustar equipe, layout e processos."
  - q: "Vale mais a pena ter CD próprio ou terceirizado?"
    a: "O CD próprio dá mais controle e pode ser mais barato em volumes grandes e estáveis, mas exige investimento, gestão de pessoas e tecnologia. O terceirizado, com operador logístico, transforma custos fixos em variáveis e permite crescer ou reduzir rápido. Muitas empresas começam terceirizando e avaliam internalizar depois de alcançar escala."
multimodal:
  - q: "Qual a diferença entre transporte multimodal e intermodal?"
    a: "Os dois usam mais de um modal, mas no multimodal existe um único contrato e um único responsável, o Operador de Transporte Multimodal, do início ao fim. No intermodal, cada trecho tem contrato e documento próprios, e o embarcador coordena ou contrata vários transportadores. A diferença está na responsabilidade jurídica, não no trajeto físico."
  - q: "O que é o OTM?"
    a: "OTM é o Operador de Transporte Multimodal, empresa habilitada que assume a responsabilidade pela carga desde o recebimento até a entrega, mesmo subcontratando outros transportadores. No Brasil, a atividade é regulada pela Lei 9.611 de 1998, e o operador precisa de habilitação junto à ANTT para exercer essa função."
  - q: "Quais as vantagens do transporte multimodal?"
    a: "Para o embarcador, a principal vantagem é ter um único interlocutor e um só documento para todo o trajeto, simplificando a gestão e a responsabilização em caso de avaria. Além disso, combinar ferrovia, cabotagem e rodovia costuma reduzir custo e emissões em longas distâncias, aproveitando o melhor de cada modal."
  - q: "Por que o multimodal ainda é pouco usado no Brasil?"
    a: "Entre os motivos estão a malha ferroviária e hidroviária concentrada em poucos corredores, a falta de terminais de integração, a burocracia fiscal entre estados e a força do modal rodoviário, que oferece flexibilidade porta a porta. Ainda assim, o uso cresce em cargas como grãos, celulose, contêineres e produtos siderúrgicos."
  - q: "Qual documento acompanha a carga no multimodal?"
    a: "No transporte multimodal, o operador emite um documento único de transporte, o Conhecimento de Transporte Multimodal de Cargas, que cobre toda a operação. No sistema fiscal eletrônico brasileiro, há modalidade específica de CT-e para essa situação. O documento único é justamente o que diferencia o multimodal da simples combinação de modais."
intermodal:
  - q: "O que é transporte intermodal com contêiner?"
    a: "É o uso do mesmo contêiner em diferentes modais, como navio, trem e caminhão, sem abrir a carga. O contêiner é transferido de um veículo para outro em terminais, o que reduz manuseio, avarias e roubos. Esse padrão de carga unitizada foi o que tornou viável o comércio internacional em grande escala."
  - q: "Qual a vantagem do intermodal em relação ao rodoviário puro?"
    a: "Em longas distâncias, usar ferrovia ou cabotagem no trecho principal costuma reduzir o custo por tonelada e as emissões de carbono, além de diminuir o risco de roubo nas rodovias. A desvantagem é o prazo, geralmente mais longo, e a necessidade de coordenar transbordos entre modais diferentes."
  - q: "Quem é responsável pela carga no transporte intermodal?"
    a: "Cada transportador responde pelo seu trecho, conforme o contrato e o documento que emitiu. Se houver avaria, é preciso identificar em qual etapa ocorreu o problema para cobrar o responsável. Por isso, registrar as condições da carga e do lacre do contêiner em cada transbordo é fundamental."
  - q: "Quais exemplos de intermodal existem no Brasil?"
    a: "Alguns exemplos são grãos do Centro-Oeste que seguem de caminhão até terminais ferroviários e depois para portos como Santos e Paranaguá, contêineres que descem de trem do interior paulista ao porto, e cargas que combinam cabotagem entre Manaus e o Sudeste com caminhão nas pontas."
  - q: "Intermodal é sempre mais barato?"
    a: "Não. O intermodal tende a ser mais barato em grandes volumes e longas distâncias, mas em trajetos curtos ou cargas pequenas os custos de transbordo, armazenagem nos terminais e coordenação podem anular a economia. A decisão deve comparar custo total, prazo, risco e necessidades de estoque da empresa."
rntrc:
  - q: "Quem precisa ter RNTRC?"
    a: "Precisam do RNTRC todas as pessoas e empresas que fazem transporte rodoviário remunerado de cargas por conta de terceiros, incluindo transportadores autônomos, empresas de transporte e cooperativas. Quem transporta apenas a própria carga, como uma indústria levando seus produtos em frota própria, não precisa do registro, mas continua sujeito às regras de trânsito e fiscais."
  - q: "Como consultar se um transportador tem RNTRC ativo?"
    a: "A consulta é pública e pode ser feita pelos canais da ANTT, informando CPF, CNPJ ou placa do veículo. É uma verificação importante antes de contratar um transportador, porque contratar alguém sem registro válido pode gerar multa também para o contratante e problemas com o seguro em caso de sinistro."
  - q: "Quais as categorias do RNTRC?"
    a: "O registro tem três categorias principais, Transportador Autônomo de Cargas (TAC), Empresa de Transporte Rodoviário de Cargas (ETC) e Cooperativa de Transporte Rodoviário de Cargas (CTC). Cada categoria tem requisitos próprios de documentação, como comprovação de experiência ou de responsável técnico, e de veículos vinculados ao registro."
  - q: "O RNTRC tem validade?"
    a: "Sim. O registro precisa ser mantido atualizado e revalidado periodicamente, com prazos definidos pela ANTT. Alterações como inclusão ou exclusão de veículos e mudanças no cadastro da empresa também devem ser informadas. Um registro vencido ou suspenso impede a emissão regular de documentos de transporte e o recebimento do frete."
  - q: "Qual a relação entre RNTRC e o pagamento do frete ao autônomo?"
    a: "Nas contratações de transportadores autônomos e equiparados, o pagamento do frete deve ser feito por meios eletrônicos habilitados pela ANTT, vinculados ao registro do transportador. Essa regra busca dar transparência, garantir o cumprimento dos pisos mínimos de frete e evitar a antiga carta-frete, que dificultava a fiscalização."
otif:
  - q: "Como calcular o OTIF?"
    a: "Divide-se o número de pedidos entregues no prazo e completos pelo total de pedidos do período, multiplicando por 100. Um pedido conta como sucesso apenas se cumprir os dois critérios ao mesmo tempo. Por exemplo, 920 pedidos perfeitos em 1.000 entregas resultam em OTIF de 92%."
  - q: "Qual é um bom OTIF?"
    a: "Depende do setor e do contrato. Grandes redes varejistas costumam exigir de fornecedores índices acima de 95%, com multas quando a meta não é cumprida. Em operações mais complexas, como importação ou cargas especiais, metas entre 85% e 90% podem ser realistas. O mais importante é medir de forma consistente e acompanhar a evolução."
  - q: "Qual a diferença entre OTIF e OTD?"
    a: "O OTD, de on time delivery, mede apenas se o pedido chegou dentro do prazo. O OTIF é mais rigoroso, porque exige pontualidade e pedido completo. Uma empresa pode ter OTD alto e OTIF baixo se entrega no prazo, mas com itens faltando ou quantidades erradas."
  - q: "Quais as principais causas de OTIF baixo?"
    a: "As causas mais comuns são falta de estoque no momento da separação, erros de picking, atrasos na liberação de pedidos, problemas de agendamento no cliente, falhas de transportadoras e divergências de cadastro. Separar a análise entre falhas de prazo e de completude ajuda a encontrar a origem do problema."
  - q: "O que significa janela de entrega no OTIF?"
    a: "Muitos clientes, especialmente o varejo, definem não apenas o dia, mas um horário de recebimento. Chegar antes da janela também pode ser considerado falha, porque o CD do cliente não está preparado para receber. Por isso, contratos de OTIF precisam definir claramente o que conta como entrega no prazo."
sla:
  - q: "Quais itens um SLA logístico deve conter?"
    a: "Um bom SLA define os indicadores medidos, como prazo de expedição, OTIF, acuracidade e avarias; as metas de cada um; a forma de cálculo e a fonte dos dados; a periodicidade das reuniões de acompanhamento; as responsabilidades de cada parte; e as consequências quando as metas não são atingidas, como multas ou planos de ação."
  - q: "Qual a diferença entre SLA e KPI?"
    a: "O KPI é um indicador de desempenho que a empresa acompanha, como a produtividade de separação. O SLA é o acordo formal entre cliente e prestador que define quais indicadores serão cobrados e quais metas precisam ser cumpridas. Em geral, alguns KPIs internos se tornam metas de SLA no contrato."
  - q: "Um SLA deve prever multas?"
    a: "É comum prever penalidades financeiras proporcionais ao impacto da falha, mas muitos contratos combinam multas com bônus por desempenho acima da meta. O ideal é que as penalidades estimulem a melhoria e não apenas punam, por isso devem vir acompanhadas de planos de ação e de revisões periódicas das metas."
  - q: "Como evitar conflitos na medição do SLA?"
    a: "Definir no contrato exatamente como cada indicador é calculado, quais eventos são excluídos, como falhas causadas pelo próprio cliente, e qual sistema serve como fonte oficial dos dados. Relatórios compartilhados e reuniões mensais de análise reduzem discussões e ajudam a separar problemas de processo de problemas de medição."
  - q: "SLA e prazo de entrega ao consumidor são a mesma coisa?"
    a: "Não. O prazo informado ao consumidor é uma promessa comercial regida pelo Código de Defesa do Consumidor. O SLA é o acordo entre empresas, como entre a loja e a transportadora ou o operador logístico, definindo metas que permitem cumprir aquela promessa. A loja continua responsável perante o cliente mesmo que o parceiro falhe."
supply-chain:
  - q: "Qual a diferença entre logística e supply chain?"
    a: "Logística trata do fluxo físico e das informações de transporte, armazenagem e distribuição. Supply chain é a coordenação de toda a cadeia, envolvendo fornecedores, compras, planejamento da demanda, produção, logística, vendas e serviço ao cliente. A logística é uma parte essencial da gestão da cadeia de suprimentos, mas não a única."
  - q: "O que faz um profissional de supply chain?"
    a: "Ele planeja demanda e estoques, negocia e desenvolve fornecedores, coordena produção e distribuição, analisa custos e riscos da cadeia e acompanha indicadores de nível de serviço. No dia a dia, atua como ponte entre áreas como comercial, compras, produção, logística e finanças, buscando equilibrar custo, prazo e disponibilidade."
  - q: "O que é resiliência na cadeia de suprimentos?"
    a: "É a capacidade de a cadeia continuar funcionando ou se recuperar rapidamente após interrupções, como pandemias, desastres climáticos, greves, conflitos ou falta de componentes. Estratégias comuns incluem diversificar fornecedores, manter estoques estratégicos para itens críticos, mapear riscos e aproximar parte da produção dos mercados consumidores."
  - q: "Quais tecnologias estão transformando o supply chain?"
    a: "Destacam-se as torres de controle com dados em tempo real, sistemas de planejamento avançado, rastreamento por IoT e RFID, automação de armazéns, gêmeos digitais para simulação e análises preditivas de demanda. O desafio, na maioria das empresas, ainda é integrar dados de sistemas e parceiros diferentes antes de aplicar tecnologia sofisticada."
  - q: "Como medir o desempenho do supply chain?"
    a: "Indicadores comuns incluem OTIF, nível de serviço, giro e cobertura de estoque, ciclo de caixa, custo logístico sobre a receita, acurácia da previsão de demanda e lead time de fornecedores. Modelos de referência como o SCOR ajudam a organizar essas métricas em visões de confiabilidade, agilidade, custo e uso de ativos."
peso-cubado:
  - q: "Como calcular o peso cubado no transporte rodoviário?"
    a: "Multiplique comprimento, largura e altura da embalagem em metros para obter o volume em metros cúbicos e, em seguida, multiplique pelo fator de cubagem da transportadora, normalmente 300 kg por metro cúbico. Uma caixa de 0,5 por 0,4 por 0,4 metro tem 0,08 metro cúbico e peso cubado de 24 kg."
  - q: "Por que o fator de cubagem do aéreo é diferente?"
    a: "Porque no avião o espaço é muito mais limitado e caro do que no caminhão. O transporte aéreo usa, em geral, a relação de 1 metro cúbico para 166,7 kg, equivalente a dividir o volume em centímetros cúbicos por 6.000. Assim, cargas volumosas e leves pagam proporcionalmente mais no aéreo."
  - q: "O fator de cubagem é igual em todas as transportadoras?"
    a: "Não. Embora 300 kg por metro cúbico seja o padrão mais comum no rodoviário brasileiro, transportadoras e Correios podem usar fatores diferentes conforme o serviço, a região ou o tipo de veículo. O fator precisa estar previsto na tabela de frete e no contrato, para evitar surpresas na fatura."
  - q: "Como reduzir o peso cubado de uma remessa?"
    a: "Usar caixas do tamanho certo para cada pedido, eliminar espaços vazios com embalagens sob medida, desmontar produtos quando possível e paletizar cargas de forma compacta são as formas mais eficientes. No e-commerce, sistemas que sugerem a menor caixa possível podem reduzir significativamente o gasto com frete."
  - q: "Quem confere o peso cubado da carga?"
    a: "A transportadora mede e pesa os volumes no recebimento ou nos terminais, muitas vezes com equipamentos automáticos de cubagem. Se o valor medido for diferente do informado pelo embarcador, o frete é recalculado. Manter o cadastro de dimensões e pesos dos produtos atualizado evita divergências e cobranças extras."
carga-fracionada:
  - q: "Quando vale a pena usar carga fracionada?"
    a: "Vale a pena quando o volume enviado ocupa apenas uma parte do veículo e não justifica contratar um caminhão inteiro, o que é comum para pequenas e médias empresas e para reposição de lojas. Para volumes que se aproximam da capacidade de um veículo, a lotação dedicada costuma ser mais barata e rápida."
  - q: "Por que o prazo da carga fracionada é maior?"
    a: "Porque a mercadoria passa por várias etapas: coleta, transferência para o terminal de origem, consolidação com cargas de outros clientes, viagem até o terminal de destino, nova triagem e entrega final. Cada transbordo adiciona tempo e risco de avaria, o que não acontece na lotação, que vai direto ao destino."
  - q: "Como é calculado o frete da carga fracionada?"
    a: "Geralmente pela soma do frete-peso, calculado sobre o maior valor entre peso real e cubado, com o frete-valor sobre a nota fiscal, GRIS, pedágio por fração de peso, taxas de coleta e entrega e eventuais taxas de dificuldade de entrega. Muitas transportadoras também aplicam um valor mínimo por remessa."
  - q: "O que é a TDE na carga fracionada?"
    a: "TDE é a taxa de dificuldade de entrega, cobrada quando o destino exige tempo extra ou condições especiais, como grandes redes varejistas com agendamento e longas filas, shoppings, áreas de circulação restrita e locais com acesso complicado. Por isso é importante informar previamente o perfil do destinatário na cotação."
  - q: "Qual índice acompanha o custo da carga fracionada?"
    a: "No Brasil, a NTC&Logística divulga periodicamente o INCTF, Índice Nacional de Custos do Transporte de Carga Fracionada, que mede a variação de custos do setor em diferentes distâncias. Transportadoras e embarcadores usam o índice como referência para negociar reajustes de tabelas de frete."
roteirizacao:
  - q: "Qual a diferença entre roteirização estática e dinâmica?"
    a: "Na roteirização estática, as rotas são planejadas uma vez, normalmente antes da saída dos veículos, com base nos pedidos do dia. Na dinâmica, o sistema recalcula as rotas ao longo do dia considerando trânsito, novos pedidos, cancelamentos e atrasos. A dinâmica é mais comum em entregas urbanas e serviços com alta variação."
  - q: "Quais dados são necessários para roteirizar?"
    a: "É preciso ter endereços geocodificados corretamente, peso e volume dos pedidos, capacidade e tipos de veículos, janelas de horário de cada cliente, tempo médio de descarga, jornada dos motoristas e restrições de circulação. Endereços imprecisos são a principal causa de rotas que parecem boas no sistema e falham na rua."
  - q: "Quanto um roteirizador pode economizar?"
    a: "Empresas que trocam o planejamento manual por um roteirizador costumam reduzir entre 10% e 20% da quilometragem rodada, além de diminuir o número de veículos necessários. Os resultados variam conforme a qualidade do planejamento anterior, a densidade das entregas e a disciplina da equipe em seguir as rotas definidas."
  - q: "Roteirizar é só escolher o menor caminho?"
    a: "Não. O menor caminho entre dois pontos é um problema simples. A roteirização resolve o problema de decidir quais pedidos vão em cada veículo e em que ordem, respeitando capacidade, horários e restrições. Por isso o objetivo pode ser reduzir custo total, número de veículos ou tempo, e não apenas a distância."
  - q: "Quais restrições de circulação afetam a roteirização no Brasil?"
    a: "Cidades como São Paulo têm zonas de restrição de caminhões em horários de pico, rodízio de placas e áreas com permissão apenas para veículos urbanos de carga. Outras capitais adotam regras semelhantes. O roteirizador precisa conhecer essas restrições para escolher o tipo de veículo e o horário de cada entrega."
exw:
  - q: "Quando faz sentido usar EXW?"
    a: "Faz sentido quando o comprador tem estrutura logística forte no país do vendedor, como uma filial ou um agente de carga experiente, e quer controlar todo o transporte. Também é usado em vendas domésticas e em amostras. Em exportações comuns, costuma criar problemas porque o comprador estrangeiro raramente consegue fazer o desembaraço de exportação."
  - q: "Quem faz o desembaraço de exportação no EXW?"
    a: "Pelas regras Incoterms 2020, o comprador. Na prática brasileira, porém, a exportação precisa ser registrada pelo exportador, com a nota fiscal de exportação e a DU-E emitidas por uma empresa estabelecida no Brasil. Por isso muitos especialistas recomendam o FCA em vez do EXW nas exportações brasileiras."
  - q: "No EXW, quem carrega o caminhão na fábrica?"
    a: "Pelas regras, o vendedor apenas coloca a mercadoria à disposição e não tem obrigação de carregá-la no veículo do comprador. Na prática, como o vendedor tem empilhadeiras e pessoal, ele costuma ajudar, mas qualquer dano durante o carregamento fica sob risco do comprador. O ideal é combinar isso por escrito."
  - q: "Qual a diferença entre EXW e FCA?"
    a: "No EXW, o vendedor só disponibiliza a mercadoria em seu estabelecimento. No FCA, ele também a entrega ao transportador indicado pelo comprador, carregada quando a entrega é em seu próprio local, e já desembaraçada para exportação. O FCA divide melhor as responsabilidades e evita os problemas de exportação do EXW."
  - q: "O preço EXW é o mais barato para o comprador?"
    a: "O preço da mercadoria é o menor, porque não inclui frete, embalagem de exportação nem custos de desembaraço. Mas o custo total pode ser maior, porque o comprador assume coleta, documentação, frete interno no país de origem e riscos desde a fábrica. Compare sempre o custo final entregue, não só o preço da cotação."
kanban:
  - q: "Kanban na logística é o mesmo que kanban de projetos?"
    a: "Não. O kanban original, criado na Toyota, é um sistema de reposição de materiais baseado no consumo real, usando cartões ou caixas que autorizam produção e abastecimento. O kanban de projetos, popular em equipes de software, adaptou a ideia de visualizar o fluxo de trabalho em colunas, mas tem objetivos diferentes."
  - q: "Como calcular a quantidade de cartões kanban?"
    a: "Uma fórmula comum multiplica a demanda média diária pelo tempo de reposição em dias, acrescenta uma margem de segurança e divide pelo número de peças em cada contêiner ou caixa. O resultado é o número de cartões em circulação, que deve ser revisado sempre que demanda ou prazo de reposição mudarem."
  - q: "O que é kanban eletrônico?"
    a: "É a versão digital do sistema, em que a leitura de um código de barras ou sensor ao esvaziar uma caixa envia automaticamente o sinal de reposição ao almoxarifado ou ao fornecedor. Elimina a perda de cartões, acelera a comunicação e permite acompanhar o consumo em tempo real, inclusive com fornecedores externos."
  - q: "Quais as regras básicas do kanban?"
    a: "Não produzir nem movimentar nada sem um sinal kanban, não enviar peças com defeito para a etapa seguinte, respeitar as quantidades definidas em cada cartão, retirar materiais apenas quando houver consumo e reduzir gradualmente o número de cartões para expor problemas. Quebrar essas regras faz o sistema voltar a acumular estoque."
  - q: "Em que tipo de operação o kanban funciona melhor?"
    a: "Funciona melhor com demanda relativamente estável e itens de consumo repetitivo, como peças de montagem, embalagens e materiais de linha. Para produtos sob encomenda, com alta variação ou demanda muito baixa, o planejamento por MRP ou por pedido costuma ser mais adequado, às vezes combinado com kanban em parte dos itens."
