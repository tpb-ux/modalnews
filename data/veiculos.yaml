  comp: 25,00 m a 30,00 m com AET (PBTC acima de 57 t)
  aet: true
  rntrc_tipo: Combinação de veículos de carga (CVC)
  texto: Rodotrem é a combinação de um caminhão-trator com dois semirreboques unidos por um dolly, chegando a nove eixos. Por ter PBTC acima de 57 t, só pode circular com Autorização Especial de Trânsito (AET), com PBTC de até 74 t e comprimento entre 25 m e 30 m, conforme a Resolução CONTRAN 882/2021. É usado em rotas de alta demanda, como escoamento de grãos, cana-de-açúcar e celulose, onde reduz o número de viagens e o custo por tonelada.
  usos:
  - Grãos em corredores de exportação
  - Cana-de-açúcar
  - Celulose
  gl:
  - frete-minimo
  - carga-lotacao
  - custo-logistico
  faq:
  - - Qual a diferença entre bitrem e rodotrem?
    - O bitrem liga dois semirreboques por quinta roda e chega a 57 t sem AET. O rodotrem usa um dolly entre os semirreboques, tem até nove eixos e 74 t, e precisa de AET.
  - - Quem emite a AET?
    - 'O órgão com jurisdição sobre a via: o DNIT nas rodovias federais, ou a ANTT/concessionária conforme o caso, e os DERs nas rodovias estaduais.'
- slug: cegonha
  nome: Cegonha (transporte de veículos)
  curto: Cegonha
  eixos: 0
  conjuntos: []
  comp: Conforme a configuração (18,60 m para cavalo + semirreboque); dimensões especiais dependem de AET
  aet: false
  rntrc_tipo: Caminhão-trator + semirreboque ou caminhão + reboque
  texto: Cegonha é o nome popular do veículo de transporte de automóveis, com estrutura em dois andares e rampas para carregar carros novos ou usados. Pode ser um caminhão-trator com semirreboque ou um caminhão com reboque, e segue os mesmos limites de peso por eixo e de comprimento da Resolução CONTRAN 882/2021 para a configuração adotada; composições fora desses limites precisam de Autorização Especial de Trânsito. Na tabela de frete mínimo da ANTT, o transporte de veículos entra como carga geral, e o valor depende do número de eixos do conjunto. Como qualquer veículo de carga, a cegonha deve respeitar a largura máxima de 2,60 m e a altura máxima de 4,40 m previstas na Resolução CONTRAN 882/2021; a altura costuma ser o limite mais crítico, por causa do andar superior carregado. Na operação, o motorista amarra cada veículo com cintas nas rodas, verifica a folga para viadutos e passarelas e confere avarias na carga e na descarga, registrando o estado dos carros em vistoria. O seguro de carga
    e a responsabilidade por avarias seguem as regras gerais do transporte rodoviário de cargas, com RCTR-C obrigatório para o transportador.
  usos:
  - Distribuição de veículos das montadoras
  - Transporte de carros usados
  - Leilões e locadoras
  gl:
  - carga-lotacao
  - frete-minimo
  - seguro-de-carga
  faq:
  - - Quantos carros cabem numa cegonha?
    - Depende do tamanho dos veículos e do implemento; a quantidade é limitada pelos pesos por eixo e pelas dimensões máximas da configuração, não por um número fixo em lei.
  - - Cegonha paga frete mínimo?
    - Sim, quando contratada como lotação por terceiros. Aplica-se o coeficiente da ANTT para o tipo de carga e o número de eixos do conjunto.
  - - Qual a altura máxima de uma cegonha?
    - A Resolução CONTRAN 882/2021 limita a altura de qualquer veículo de carga a 4,40 m e a largura a 2,60 m. Composições que excedam esses limites só podem circular com Autorização Especial de Trânsito emitida pelo órgão com jurisdição sobre a via.
  - - Que seguro a cegonha precisa ter?
    - O transportador rodoviário de cargas deve contratar o seguro obrigatório de responsabilidade civil (RCTR-C), que cobre danos à carga em caso de acidente com o veículo transportador. Coberturas para roubo e outros riscos dependem de contratação adicional.
