# Regra de qualidade: só feeds que entregam itens com imagem própria (no feed ou og:image) a partir do GitHub Actions.
# Removidos em 12/10/2026: Portal NTC&Logística (vazio a partir dos runners do GitHub).
# Feeds RSS usados pelo fetch.py. "editoria" (opcional) força a editoria; senão classifica por palavras-chave.
max_por_execucao: 20
max_por_feed: 3
max_idade_dias: 3
feeds:
  - {nome: Logweb, url: "https://www.logweb.com.br/feed/", confiavel: true, max: 8}
  - {nome: Comex do Brasil, url: "https://www.comexdobrasil.com/feed/", confiavel: true, editoria: comercio-exterior}
  - {nome: Blog do Caminhoneiro, url: "https://blogdocaminhoneiro.com/feed/", confiavel: true, editoria: transporte}
  - {nome: Transporte Moderno, url: "https://www.transportemoderno.com.br/feed/", confiavel: true, editoria: transporte}
  - {nome: Frota&Cia, url: "https://www.frotacia.com.br/feed/", confiavel: true, editoria: transporte}
  - {nome: O Carreteiro, url: "https://www.ocarreteiro.com.br/feed/", confiavel: true, editoria: transporte}
  - {nome: Diário do Transporte, url: "https://www.diariodotransporte.com.br/feed/"}  # cobre muito transporte de passageiros: passa pela nota mínima

# Filtros de qualidade. Feeds com "confiavel: true" (portais do setor) dispensam a nota mínima,
# mas continuam sujeitos às listas de bloqueio.
# Filtros de qualidade (aplicados antes de publicar e por `python fetch.py --revisar`)
nota_minima: 3          # palavra-chave no título vale 3, no resumo vale 1
bloqueio_fontes: [vietnam.vn, gitlab, lrcadefenseconsulting.com, a crítica, indexbox, правда, brasil 247, oficina da net, jornal de angola, notícias de aveiro, almada online, aliados brasil, brasil do trecho, ilos]
bloqueio_palavras: [fretamento, turismo, turístic, rodoviária, linha intermunicipal, linhas intermunicipais, transporte de passageiros, transporte público, passagem, passagens, BRT, VLT, trem de passageiros, concessionária, automobilístic, test drive, revisões gratuitas, exército, militar, semicondutor, futebol, novela, horóscopo, celebridade, software supply chain, pacotes arriscados, eleições, eleitoral, campanha de lula, candidato, maconha, apreendido, preso em flagrante, bateria de, cupom, desconto, promoção, oferta do dia, polícia, atentado, ônibus, trincas, celebra, lula, bolsonaro, cocaína, metrô, metrôrio, viação, passageiros, transporte coletivo, leito-cama, feriado, vagas para, casino, cassino, spiel, gold]
